          - train_test
          - anomaly_label
          - machine_id_label
        args:
          scores: ["knn"]
          output_metric: auc


      - name_key: pAUC (KNN)
        tensorboard_type: scalar
        metric_type: new_average_performance
        dataset_mode: 
